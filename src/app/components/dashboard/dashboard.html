@if (tabs$ | async; as tabs) {
  <nav mat-tab-nav-bar [tabPanel]="tabPanel">
    @for (tab of tabs.tabs; track tab.title) {
      <a mat-tab-link
         [routerLink]="['..', tab.id]"
         (click)="activeLink = tab.id"
         [active]="activeLink == tab.id"> {{tab.id}} </a>
    }
  </nav>
  <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
  <app-tab-content [cards]="currentTab.cards" />
} @else {
  <div class="empty-dashboard">You don’t have any dashboards yet. They’ll appear here as soon as you create them.</div>
}
