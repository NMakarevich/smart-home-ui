@if (tabs$ | async; as tabs) {
  <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
    @for (tab of tabs.tabs; track tab.title) {
      <mat-tab [label]="tab.title">
        <app-tab-content [cards]="tab.cards" />
      </mat-tab>
    }
  </mat-tab-group>
} @else {
  <div class="empty-dashboard">You don’t have any dashboards yet. They’ll appear here as soon as you create them.</div>
}
