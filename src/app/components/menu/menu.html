<mat-list>
  @for (item of dashboards(); track item) {
    <mat-list-item>
      <a mat-list-item [routerLink]="['dashboard', item.id]" class="mat-list-item__content">@if (item.icon) {
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      }
        {{ item.title }}
      </a>
    </mat-list-item>
  }
</mat-list>
